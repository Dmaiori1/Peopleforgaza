name: Verify site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Standard hosted compute is free for public repositories.
    # Skip before allocating a runner if the repository becomes private.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Python ${{ matrix.python }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            node: "18"
          - python: "3.12"
            node: "24"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Run offline checks
        run: python3 scripts/verify.py
      - name: Validate reviewed static package
        run: python3 scripts/build_static.py
